[package]
name = "rusty-dlp-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
thiserror = "2"
tempfile = "3"
url = "2"
dotenvy = "0.15.7"
dptree = "0.5.1"
teloxide = { version = "0.17.0", default-features = false, features = ["rustls", "throttle", "macros", "ctrlc_handler"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "process"] }
