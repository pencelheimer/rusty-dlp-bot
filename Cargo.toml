[package]
name = "rusty-dlp-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
dotenvy = "0.15.7"
dptree = "0.5.1"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
teloxide = { git = "https://github.com/lapismyt/teloxide", branch = "bot-api-10-0", default-features = false, features = ["rustls", "throttle", "macros", "ctrlc_handler"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "process"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
