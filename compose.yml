services:
  bot:
    image: ghcr.io/pencelheimer/rusty-dlp-bot:latest
    restart: unless-stopped
    environment:
      TELOXIDE_TOKEN: ${TELOXIDE_TOKEN}
      RUST_LOG: ${RUST_LOG:-warn,rusty_dlp_bot=info}

      # Uncomment to enable cookie-based auth
      # YT_DLP_COOKIES: /cookies.txt

      # Uncomment to load config from a custom path instead of the baked-in /app/config.toml
      # CONFIG_PATH: /config.toml
    # volumes:
    #   - /path/to/cookies.txt:/cookies.txt:ro
    #   - /path/to/config.toml:/config.toml:ro
